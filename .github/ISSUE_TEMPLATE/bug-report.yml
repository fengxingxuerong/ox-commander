name: Bug 报告
description: 报告一个缺陷 —— 带复现步骤与门禁事实，不带"verify 挂了"四个字
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜一遍已有 issue。与门禁（verify）相关的 bug，
        请附上**具体哪一段**红与退出码 —— 本项目 33 段里每一段的失败语义都不同，
        "verify 挂了"无法归因。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际行为。尽量一句一人话，加关键报错行。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 从干净状态开始的最小步骤。能给出命令就给命令。
      placeholder: |
        1. git checkout <sha>
        2. npm ci
        3. <命令>
        4. 看到 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你觉得正确的行为是什么，依据是什么（文档/凭据/竞品口径）。
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统与版本
      placeholder: Windows 11 23H2 / Ubuntu 24.04 / macOS 15
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js 版本
      placeholder: "22.11.0（要求 >= 20.19）"
    validations:
      required: true

  - type: dropdown
    id: entry
    attributes:
      label: 入口
      options:
        - 桌面端（Electron）
        - headless CLI（JSONL 协议）
        - serve 常驻服务
        - MCP server
        - npx oxcommander CLI 包
        - 门禁 / CI
        - 其他
    validations:
      required: true

  - type: textarea
    id: gate
    attributes:
      label: 门禁事实（若与 verify 相关）
      description: 哪一段红、退出码、关键输出行。不相关就留空。
      placeholder: |
        段: mutation:touched
        退出码: 1
        关键输出: …
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充上下文
      description: 截图、日志文件、你已排除的可能性。可选。
    validations:
      required: false
