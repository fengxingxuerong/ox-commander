name: release

# 产出可安装的分发包（Windows / Linux）。
#
# 为什么不放在 verify.yml 里：verify 是"每次 push 都要跑的快门禁"，
# 打包要下载 Electron 二进制 + 各平台工具链，一次几分钟到十几分钟，
# 塞进去会把门禁拖慢到没人愿意等。
#
# 触发方式两种：
#   - 打 tag（v*）：打包并**建 GitHub Release**、把安装包挂上去
#   - workflow_dispatch：只打包、上传为 workflow artifact
#     用途是在不打 tag 的前提下**验证打包配置本身**（新配置第一次就该这么试）
#
# ⚠️ 这里不能设 ELECTRON_SKIP_BINARY_DOWNLOAD：verify.yml 设它是因为
# "只需要类型定义、从不启动 Electron"，而打包恰恰需要那个二进制。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 发布前先过一遍完整门禁。理由很直白：这条流水线产出的东西是**装进别人机器的 exe**，
  # 而 tag 可以在任何一次提交上打（包括从没跑过 verify 的那次）。旧版本地实测过：
  # 不打断也没人会发现——verify 绿与 release 绿此前是两件事。
  #
  # 为什么在这里重写一遍步骤而不是复用 verify.yml：那个文件只有 push 触发器，
  # 没有 workflow_call，跨文件调用需要改它；重复十行比引入隐式耦合便宜。
  # 只在 ubuntu 上跑一次：打包 job 自己会在 windows 上 tsc 构建，编译类问题在那里也会暴露。
  verify:
    name: verify (release gate)
    runs-on: ubuntu-latest
    env:
      # 这个 job 同样不启动 Electron，只要类型定义。
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      # fetch-depth: 0 —— 这个 job 跑 `npm run verify`，其中第 19 步要用 HEAD~1 定基线
      # （默认浅克隆没有父提交，那一步会崩）。详见 .github/workflows/verify.yml 同处注释。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify
        run: npm run verify

  build:
    name: package (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Package
        run: npm run build:dist

      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

      # 只在打 tag 时建 Release。用 runner 预装的 gh，不引第三方 action。
      - name: Create release and attach installers
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes release/*
