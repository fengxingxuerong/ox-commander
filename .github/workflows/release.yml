name: release

# 产出可安装的分发包（Windows / Linux）。
#
# 为什么不放在 verify.yml 里：verify 是"每次 push 都要跑的快门禁"，
# 打包要下载 Electron 二进制 + 各平台工具链，一次几分钟到十几分钟，
# 塞进去会把门禁拖慢到没人愿意等。
#
# 触发方式两种：
#   - 打 tag（v*）：打包并**建 GitHub Release**、把安装包挂上去
#   - workflow_dispatch：只打包、上传为 workflow artifact
#     用途是在不打 tag 的前提下**验证打包配置本身**（新配置第一次就该这么试）
#
# ⚠️ 这里不能设 ELECTRON_SKIP_BINARY_DOWNLOAD：verify.yml 设它是因为
# "只需要类型定义、从不启动 Electron"，而打包恰恰需要那个二进制。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 同一 ref 上重复触发时取消旧的。2026-09-25 出现过一次很难看的情况：
# 两个 package job 停在 checkout / setup-node 阶段 in_progress 三十多小时（runner 一直没供给），
# 既不失败也不结束，把后续的 run 全堵在后面。取消旧的 + 下面每个 job 自带 timeout，
# 让它至少显式失败、留下"卡在哪一步"的事实。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # 诊断步骤要把 electron-builder 的输出写进 check run，见 build job 末尾。
  checks: write

jobs:
  # 发布前先过一遍完整门禁。理由很直白：这条流水线产出的东西是**装进别人机器的 exe**，
  # 而 tag 可以在任何一次提交上打（包括从没跑过 verify 的那次）。旧版本地实测过：
  # 不打断也没人会发现——verify 绿与 release 绿此前是两件事。
  #
  # 为什么在这里重写一遍步骤而不是复用 verify.yml：那个文件只有 push 触发器，
  # 没有 workflow_call，跨文件调用需要改它；重复十行比引入隐式耦合便宜。
  # 只在 ubuntu 上跑一次：打包 job 自己会在 windows 上 tsc 构建，编译类问题在那里也会暴露。
  verify:
    name: verify (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 这个 job 同样不启动 Electron，只要类型定义。
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      # fetch-depth: 0 —— 这个 job 跑 `npm run verify`，其中第 19 步要用 HEAD~1 定基线
      # （默认浅克隆没有父提交，那一步会崩）。详见 .github/workflows/verify.yml 同处注释。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify
        run: npm run verify

  build:
    name: package (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # 为什么不直接 `run: npm run build:dist`：
      # 2026-09-24 的两个 package job 都是在这**一步**红的，而本仓库读不到 job 日志
      # （`GET .../actions/jobs/{id}/logs` → 403 Must have admin rights），
      # 于是"打包为什么失败"只能靠猜，猜了三轮也没修好。
      # 所以这里先把输出落到文件、再把它送进两个**公开可读**的通道：
      # ① artifact（人可以在页面上下载）；② check run 的 output.text（无需 admin 权限即可读）。
      # 判失败的动作挪到末尾单独一步，日志先走完再红。
      - name: Package
        id: package
        continue-on-error: true
        shell: bash
        env:
          # electron-builder 走 debug 模块，默认只打印人话摘要、不打印为什么。
          DEBUG: electron-builder
        run: |
          set -o pipefail
          npm run build:dist 2>&1 | tee build-dist.log
          code=${PIPESTATUS[0]}
          echo "package exit=$code"
          # 必须显式 exit：步骤的 outcome 取最后一条命令的退出码，
          # 上面的 echo 会把失败码盖成 0，后面的诊断步骤就永远不会跑。
          exit $code

      - name: Collect packaging diagnostics
        if: always()
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          {
            echo "--- env ---"
            node -v
            npm -v
            echo "matrix.os=$MATRIX_OS  runner.os=$RUNNER_OS"
            echo "--- build-dist.log ---"
            cat build-dist.log 2>&1
            echo "--- release/ ---"
            ls -la release 2>&1
            echo "--- dist dirs ---"
            ls -la dist dist-electron dist-headless 2>&1
          } > diagnostics.txt 2>&1
          wc -c diagnostics.txt

      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-diagnostics-${{ matrix.os }}
          path: |
            diagnostics.txt
            build-dist.log
          if-no-files-found: warn

      # 把诊断文本挂到 check run 上：它走 checks API，公开仓库无需 admin，
      # 是本仓库唯一能**在 CI 之外**读到打包报错的通道。内容截断在 60 KB 内（API 上限 65535）。
      #
      # ⚠️ 条件为什么是 `always()` 而不是 `steps.package.outcome == 'failure'`：
      # v0.1.2-rc2 上打包**成功了**，红的是后面的 `Upload installers` —— 而诊断只在打包失败时
      # 才发，于是"打包之后挂掉"这一步又变成只能猜。诊断里含 `ls -la release`，
      # 正是排查这类"产物到底长什么样"问题最需要的那一份事实。成功时也发一份只是多一个
      # neutral check，不影响任何门禁（conclusion 不是 failure）。
      - name: Publish diagnostics to check run
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          MATRIX_OS: ${{ matrix.os }}
        with:
          script: |
            const fs = require('fs');
            const os = process.env.MATRIX_OS;
            let text = '';
            try { text = fs.readFileSync('diagnostics.txt', 'utf8'); } catch (e) { text = '(diagnostics.txt 读取失败: ' + e.message + ')'; }
            const LIMIT = 60000;
            const tail = text.length > LIMIT ? text.slice(text.length - LIMIT) : text;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `packaging-diagnostics (${os})`,
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: `electron-builder 失败诊断 (${os})`,
                summary: '打包失败时的完整输出，供无 admin 权限者读取。完整版见 packaging-diagnostics artifact。',
                text: tail,
              },
            });

      - name: Fail the job if packaging failed
        if: steps.package.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::npm run build:dist 失败，诊断已上传（artifact: packaging-diagnostics-${{ matrix.os }}）"
          exit 1

      - name: Upload installers (artifact)
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          # ⚠️ 试过用 `!release/*/**` 排掉 win-unpacked/ 这类中间目录树，结果这一步
          # 在两个 OS 上**同时 failure**（v0.1.2-rc2）：该排除模式把 release/ 下的文件
          # 一起否掉了，于是 `if-no-files-found: error` 触发。artifact 里多带一份
          # unpacked 只是体积问题，不是阻塞项 —— 先回到已验证可用的写法。
          # 要看清 release/ 到底产出了什么，读 check run 里的 `ls -la release`（见下）。
          path: release/*
          if-no-files-found: error

      # 只在打 tag 时建 Release。用 runner 预装的 gh，不引第三方 action。
      - name: Create release and attach installers
        id: release
        if: startsWith(github.ref, 'refs/tags/v') && steps.package.outcome == 'success'
        # 这一步自己也要走诊断通道：2026-09-26 的 v0.1.2-rc1 上，打包**成功了**、
        # 安装包也传上了，唯独这一步红 —— 而当时的诊断只在 package 失败时才发，
        # 于是"为什么建不出 Release"又变成只能猜。所以先 continue-on-error 把输出落盘，
        # 判失败挪到末尾单独一步。
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 只取 release/ 根下的**普通文件**：`release/*` 会把 win-unpacked/ 这类目录
          # 一起展开进 argv，gh 收到目录参数会直接拒绝（v0.1.2-rc1 上这一步红的直接原因）。
          # 顺带排掉 electron-builder 自己写的 builder-debug.yml —— 那是 effective config 的
          # 快照、给排查打包用的，不该挂到用户下载列表里（v0.1.2-rc3 上它就混进去了）。
          assets=()
          while IFS= read -r f; do assets+=("$f"); done < <(
            find release -maxdepth 1 -type f | sort | grep -v -e '/builder-debug\.yml$'
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::release/ 下没有可挂载的文件，先确认 electron-builder 产出了安装包"
            ls -la release
            exit 1
          fi

          # 两个 OS 的 job **都会**跑到这一步，而同一个 tag 只能有一个 Release：
          # v0.1.2-rc3 上 windows 先建好，ubuntu 接着撞上
          # "a release with the same tag name already exists" —— 打包全绿却整个 job 红掉。
          # 所以先探一次，已存在就改用 upload 追加（--clobber 覆盖同名资产）。
          # create 失败时再回退一次 upload，是为了覆盖两个 job **同时**判成"不存在"的竞态。
          mode=create
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then mode=upload; fi

          if [ "$mode" = create ]; then
            echo "attaching ${#assets[@]} file(s) to a new release:"
            printf '  %s\n' "${assets[@]}"
            gh release create "$GITHUB_REF_NAME" --generate-notes "${assets[@]}" 2>&1 | tee release-create.log
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ]; then exit 0; fi
            if ! grep -qi "already exists" release-create.log; then exit "$code"; fi
            echo "另一个 OS 的 job 抢先建好了同一个 release，改为追加资产"
          fi

          echo "uploading ${#assets[@]} file(s) to the existing release:"
          printf '  %s\n' "${assets[@]}"
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber 2>&1 | tee -a release-create.log
          exit "${PIPESTATUS[0]}"

      # 与打包诊断同一个通道（checks API，公开仓库无需 admin），但用不同的 check 名，
      # 免得把"打包失败"与"建 Release 失败"两份诊断混在一个 output 里分不清。
      - name: Publish release diagnostics to check run
        if: steps.release.outcome == 'failure'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          MATRIX_OS: ${{ matrix.os }}
        with:
          script: |
            const fs = require('fs');
            const os = process.env.MATRIX_OS;
            let text = '';
            try { text = fs.readFileSync('release-create.log', 'utf8'); } catch (e) { text = '(release-create.log 读取失败: ' + e.message + ')'; }
            const LIMIT = 60000;
            const tail = text.length > LIMIT ? text.slice(text.length - LIMIT) : text;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `release-create-diagnostics (${os})`,
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: `gh release create 失败诊断 (${os})`,
                summary: '打包已成功、安装包已上传，但建 GitHub Release 失败时的完整输出。',
                text: tail,
              },
            });

      - name: Fail the job if release creation failed
        if: steps.release.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::gh release create 失败，诊断已写入 check run 'release-create-diagnostics (${{ matrix.os }})'"
          exit 1
