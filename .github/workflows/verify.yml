name: verify

# The one command that IS the gate: typecheck (3 tsconfigs) → tests → desktop
# build → headless build. Keep this file thin — if it needs to know more than
# `npm run verify`, the gate has drifted out of `package.json`.
on:
  push:
    branches: ["**", "!ci-diagnose-ubuntu"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Electron ships a ~100 MB binary we never launch here; the type definitions
  # in node_modules are all the build needs.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows matters: the sandbox has a taskkill path and the CLI adapter
        # spawns .cmd shims, neither of which is exercised on Linux.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        # 第 19 步 `mutation:touched` 靠 `HEAD~1..HEAD` 圈"本次改到了哪些文件"，
        # 而 checkout 默认 depth=1 的浅克隆里**没有父提交**，那一步会直接崩
        # （2026-09-25 两个 verify job 常红的成因；本机是全历史，复现不了）。
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify (typecheck + tests + builds)
        run: npm run verify

  # 变异门禁的**全量**档单独一个 job。
  #
  # 为什么不是 `npm run mutation`（aggregate）：aggregate 用 `replaceAll` 一次改掉
  # 该算子的**全部**位点，"任一处被杀死"就报杀死 —— 2026-09-23 实测
  # `snapshot-store.ts` 报 2/2 全杀，而源码里有 12 个 `continue`，拆单点后
  # 5 处存活。所以 aggregate 只能证明"每个算子至少被碰过"，site 口径才回答
  # "每一处位点是否真有断言"（同一份代码：aggregate 152/152 vs site 486/581）。
  #
  # 成本：实测随目标增长（2026-10-01：57 目标 / 1048 位点 / 32.5 分钟）。
  # 单点吞吐稳定在 ~1.8 秒/位点，所以耗时增长几乎全部来自位点数增长。
  # timeout 给 35 分钟时余量只剩 2.5 分 —— 而同一天的运行间抖动就有 8 分，
  # 且被 timeout 掐掉等于**丢掉整份存活清单**（本 job 的唯一产出 —— 脚本只在
  # 跑完时才把结论写进 job summary，被掐就没有）。那时"CI 红了"分不清是代码
  # 问题还是太慢。故提到 60 分。verify 里跑的仍是 `mutation:quick`
  # （tier 1、每文件 1 个变异、~30s），守住"verify 是快门禁"。
  # 2026-10-13：单 job 拆成按 tier 的两个分片（matrix）。升级的实证链：
  #   ① 60 → 100 分钟（位点 1576 → 1647 后整轮超过 60min 超时）；
  #   ② --jobs=3 在 2 vCPU 上互撞：大量 worker "异常退出（exit 0）"（子进程
  #      静默不吐 ##MUTATION_RESULT##），fail-safe 串行复核 = 双倍耗时；
  #   ③ runner 在 ~35min 被平台回收（当天 4/4 次）——整轮单 job 无论怎么调
  #      都踩这个窗口。片内 --jobs=1 串行（零子进程，② 的病灶直接消失）。
  #   ④ **2026-10-16：这两个分片不是"分区"，是"超集"。** `--tier=N` 的实现是
  #      `t.tier <= maxTier`，于是 `--tier=2` 那片实际跑的是**全部 73 个目标**
  #      （含 33 个 tier 1）。run #153 的 tier1 23.4min / tier2 54.8min 里，
  #      tier 2 那 54.8 约有 23min 是**重复跑 tier 1**；脚本自己的头注释一直写着
  #      「--tier=1 # 只跑 tier 1」（精确语义），是实现与声明不符。
  #      已把 `--tier` 改成精确匹配（tier 1 ∪ tier 2 现在才真是全集），并按 runner
  #      的回收窗口把 tier 2 用 `--shard` 再轮转切成 2 片。分片由**工具自己算**
  #      （各片之并恒为全集），不写死目标清单 —— 写死清单漏掉一个目标 = 那个目标
  #      永远不被审计，而它的 job 照样绿（本仓库反复踩过的那类"PASS 没有含义"）。
  #      修后首轮实测 @ 80946b0 run #38922557558：tier 1 17.6min、tier 2 两片 12.7 / 13.7min
  #      （五 job 全绿）；最长 job 从 54.8min 降到 17.6min，重新落回回收窗口之内。
  mutation-full:
    name: mutation (site, tier ${{ matrix.tier }} ${{ matrix.shard }})
    # 只在 Linux 跑：site 审计的存活清单里会混进"平台相关等价变异"
    # （如 `process.platform === "win32"` 在本机恒真），在另一个 OS 上跑一次
    # 才能把它们和真缺口分开。CI 用 Linux，本机是 Windows，两边合起来才是全集。
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          # tier 1（33 目标 / 737 位点）单片 ≈23min，够快，不再切。
          - { tier: 1, shard: "1/1" }
          # tier 2（40 目标 / 980 位点）单片 ≈31min —— 贴着回收窗口，轮转切 2 片。
          - { tier: 2, shard: "1/2" }
          - { tier: 2, shard: "2/2" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Mutation (site 口径，逐位点，tier ${{ matrix.tier }} 片 ${{ matrix.shard }})
        run: node scripts/mutation-check.mjs --mode=site --limit=999 --tier=${{ matrix.tier }} --shard=${{ matrix.shard }} --jobs=1

  # macOS 上的 **CLI 通路**证明（竞品缺口 A4 的落地形态）。
  #
  # 为什么不打 macOS 桌面端产物：electron-builder.yml 顶部有完整论证 ——
  # 没有签名凭据，未签名 .app 在新系统上被 Gatekeeper 直接拦下，
  # 出一个"用户打不开"的产物比不出更糟。桌面端缺口**认了**，写进 README 平台表。
  #
  # 但缺口盘点的结论是"桌面端缺口可以认，CLI 缺口不该认"：`npx oxcommander`
  # 是纯 Node 包（dist-headless/ + bin 转发），本身跨平台，却从没有任何一条
  # 路径在 macOS 上验证过它。本 job 补这一格：在 macos-latest 上真造
  # `dist-cli/` 并跑它的冒烟，外加 `smoke:demo`（真子进程 + 零网络零固定端口）。
  #
  # 为什么不跑整链 verify：verify 在 ubuntu + windows 两格已全覆盖，
  # 且 `mutation:touched` 要 HEAD~1、CI 深克隆成本不值当。本 job 只回答
  # "macOS 上这条分发通路通不通"一个问题。零凭据、零网络，失败即该通路坏了。
  cli-macos:
    name: cli (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build headless + CLI package
        run: |
          npm run build:headless
          npm run build:cli

      - name: Smoke CLI package（npx 形态）
        run: npm run smoke:cli-pkg

      - name: Smoke demo delivery（真子进程，零网络）
        run: npm run smoke:demo
