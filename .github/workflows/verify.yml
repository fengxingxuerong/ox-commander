name: verify

# The one command that IS the gate: typecheck (3 tsconfigs) → tests → desktop
# build → headless build. Keep this file thin — if it needs to know more than
# `npm run verify`, the gate has drifted out of `package.json`.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Electron ships a ~100 MB binary we never launch here; the type definitions
  # in node_modules are all the build needs.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows matters: the sandbox has a taskkill path and the CLI adapter
        # spawns .cmd shims, neither of which is exercised on Linux.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify (typecheck + tests + builds)
        run: npm run verify

  # 变异门禁的**全量**档单独一个 job：verify 里跑的是 `mutation:quick`
  # （tier 1 目标、每文件 1 个变异，~25s），而 tier 2 目标（沙箱层等慢目标）
  # 只在全量档跑 —— 2026-09-22 的教训：tier 2 出现 8 个存活变异时
  # `npm run verify` 依然是绿的，缺口长期挂着不阻塞任何门禁。
  # 放在 CI 而不是 verify 里，是为了守住"verify 是快门禁"这条成本分层：
  # 全量 ~285s，本地每次改动都跑它太重，但每次 push 跑一次完全值得。
  mutation-full:
    name: mutation (all targets)
    # 只在 Linux 跑：全量档是纯逻辑变异，不碰 Windows 特有的 taskkill / .cmd 分支，
    # 那部分由上面 verify 的 windows-latest 覆盖。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Mutation (every target, all tiers)
        run: npm run mutation
