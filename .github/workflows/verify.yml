name: verify

# The one command that IS the gate: typecheck (3 tsconfigs) → tests → desktop
# build → headless build. Keep this file thin — if it needs to know more than
# `npm run verify`, the gate has drifted out of `package.json`.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Electron ships a ~100 MB binary we never launch here; the type definitions
  # in node_modules are all the build needs.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows matters: the sandbox has a taskkill path and the CLI adapter
        # spawns .cmd shims, neither of which is exercised on Linux.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        # 第 19 步 `mutation:touched` 靠 `HEAD~1..HEAD` 圈"本次改到了哪些文件"，
        # 而 checkout 默认 depth=1 的浅克隆里**没有父提交**，那一步会直接崩
        # （2026-09-25 两个 verify job 常红的成因；本机是全历史，复现不了）。
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify (typecheck + tests + builds)
        run: npm run verify

  # 变异门禁的**全量**档单独一个 job。
  #
  # 为什么不是 `npm run mutation`（aggregate）：aggregate 用 `replaceAll` 一次改掉
  # 该算子的**全部**位点，"任一处被杀死"就报杀死 —— 2026-09-23 实测
  # `snapshot-store.ts` 报 2/2 全杀，而源码里有 12 个 `continue`，拆单点后
  # 5 处存活。所以 aggregate 只能证明"每个算子至少被碰过"，site 口径才回答
  # "每一处位点是否真有断言"（同一份代码：aggregate 152/152 vs site 486/581）。
  #
  # 成本：实测 ~21 分钟（581 个位点），故 timeout 给 35 分钟。verify 里跑的仍是
  # `mutation:quick`（tier 1、每文件 1 个变异、~30s），守住"verify 是快门禁"。
  mutation-full:
    name: mutation (site, every site)
    # 只在 Linux 跑：site 审计的存活清单里会混进"平台相关等价变异"
    # （如 `process.platform === "win32"` 在本机恒真），在另一个 OS 上跑一次
    # 才能把它们和真缺口分开。CI 用 Linux，本机是 Windows，两边合起来才是全集。
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Mutation (site 口径，逐位点)
        run: npm run mutation:audit
