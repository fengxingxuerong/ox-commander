name: diag-linux-mutation

# 单文件变异复核（Linux）。
#
# 起因（2026-10-23）：CI 的 `mutation (site, tier 1 1/1)` 在 ubuntu 上红，而同一份
# 提交在 win32 本机跑同一分片是 **exit 0 全绿** —— 说明存活位点是 Linux 专有的，
# 本机复现不出来（无 WSL/Docker）。那次靠这个矩阵 + `mutation-check` 新加的 GitHub
# 注解，一次就定位到 `electron/sandbox/path-policy.ts :: === → !== @94`。
#
# 现在只留 `workflow_dispatch`：**不自动跑**（免得每次碰这个文件都起 15 个 job）。
# 要问"某个目标在 Linux 上到底绿不绿"时手动触发，或改下面的 file 列表。
# 失败 leg 的注解自带文件名 / 算子 / 行号 —— 不用再向维护者要 job 日志。

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  audit:
    name: audit (${{ matrix.file }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        file:
          # 2026-10-23 实际拦住发布的那一个（win32 能杀、POSIX 不可达 → 靠等价锚点）：
          - electron/sandbox/path-policy.ts
          - shared/mcp.ts
          - electron/mcp/manifest.ts
          - electron/mcp/client.ts
          - electron/mcp/pool.ts
          - shared/tools/protocol.ts
          - shared/tools/policy.ts
          - shared/tools/spec.ts
          - shared/chat-events.ts
          - electron/chat/session.ts
          - electron/chat/tool-runner.ts
          - electron/chat/runtime.ts
          - electron/ipc/chat.ts
          - shared/skills.ts
          - electron/engine/skills.ts
          - src/store.ts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit (site 口径，单文件)
        run: node scripts/mutation-check.mjs --mode=site --limit=999 --file=${{ matrix.file }} --jobs=1
